services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: aichatbot_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: aichatbot
    volumes:
      - mongodb_data:/data/db
    networks:
      - aichatbot_network

  # ChromaDB Vector Database
  chromadb:
    image: chromadb/chroma:latest
    container_name: aichatbot_chromadb
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
    networks:
      - aichatbot_network

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aichatbot_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
      - chromadb
    networks:
      - aichatbot_network
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aichatbot_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    networks:
      - aichatbot_network

volumes:
  mongodb_data:
  chromadb_data:
  backend_media:
  backend_static:

networks:
  aichatbot_network:
    driver: bridge
